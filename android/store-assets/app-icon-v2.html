<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  /* Yeni uygulama simgesi. Eski simgeyle kasıtlı olarak hiçbir görsel
     akrabalığı yok:
       eski → mor uzay zemini, tam halka + kesikli dış çember, ortada küre
       yeni → derin turkuaz-lacivert zemin, KAPALI halka yok (yalnızca bir
              yay parçası), amber palet, çapraz teğet izi, köşeye yerleşmiş küre
     Böylece hem otomatik görsel eşleştirmede hem de göz kararıyla ayrı durur. */
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:512px; height:512px; overflow:hidden; }
  .stage {
    position:relative; width:512px; height:512px;
    background: linear-gradient(150deg, #04222B 0%, #06303C 46%, #0A1A38 100%);
  }
  .warm {
    position:absolute; right:-110px; top:-90px; width:420px; height:420px;
    background: radial-gradient(circle, rgba(255,176,59,0.30) 0%, rgba(255,176,59,0) 68%);
  }
  .cool {
    position:absolute; left:-130px; bottom:-140px; width:400px; height:400px;
    background: radial-gradient(circle, rgba(46,196,182,0.26) 0%, rgba(46,196,182,0) 68%);
  }
</style>
</head>
<body>
<div class="stage">
  <div class="warm"></div>
  <div class="cool"></div>

  <svg width="512" height="512" style="position:absolute;left:0;top:0">
    <defs>
      <filter id="soft" x="-80%" y="-80%" width="260%" height="260%">
        <feGaussianBlur stdDeviation="13"/>
      </filter>
      <filter id="tight" x="-80%" y="-80%" width="260%" height="260%">
        <feGaussianBlur stdDeviation="6"/>
      </filter>
      <linearGradient id="trail" x1="0" y1="1" x2="1" y2="0">
        <stop offset="0%"  stop-color="#FFB03B" stop-opacity="0"/>
        <stop offset="55%" stop-color="#FFB03B" stop-opacity=".55"/>
        <stop offset="100%" stop-color="#FFD98A" stop-opacity=".95"/>
      </linearGradient>
    </defs>

    <!-- Yay parçası: kapalı çember DEĞİL, açık bir kavis. Sol altta,
         kürenin az önce terk ettiği yörüngeyi ima eder. -->
    <path d="M 96 404 A 168 168 0 0 1 168 250"
          stroke="#2EC4B6" stroke-width="46" stroke-linecap="round"
          fill="none" opacity=".22" filter="url(#soft)"/>
    <path d="M 96 404 A 168 168 0 0 1 168 250"
          stroke="#2EC4B6" stroke-width="26" stroke-linecap="round" fill="none"/>

    <!-- İkinci, daha küçük kavis — derinlik ve ritim -->
    <path d="M 150 436 A 210 210 0 0 1 208 330"
          stroke="#2EC4B6" stroke-width="12" stroke-linecap="round"
          fill="none" opacity=".38"/>

    <!-- Çapraz teğet izi: kürenin yanında kalın, geride bir noktaya incelir.
         Düz kalın çizgi "çöp" gibi okunuyordu; daralan ve hafif kavisli
         gövde hareketi anlatıyor. -->
    <path d="M 334 170 L 358 190 Q 276 264 196 360 L 188 352 Q 262 254 334 170 Z"
          fill="url(#trail)" opacity=".55" filter="url(#tight)"/>
    <path d="M 336 172 L 354 188 Q 278 260 197 357 L 192 352 Q 266 254 336 172 Z"
          fill="url(#trail)"/>

    <!-- Küre: merkezde değil, izin ucunda sağ üstte -->
    <circle cx="366" cy="156" r="92" fill="#FFB03B" opacity=".30" filter="url(#soft)"/>
    <circle cx="366" cy="156" r="52" fill="#FFD98A" opacity=".55" filter="url(#tight)"/>
    <circle cx="366" cy="156" r="34" fill="#FFFDF5"/>

    <!-- Toplanacak ışık: küçük, uzakta, farklı renk -->
    <circle cx="188" cy="196" r="26" fill="#2EC4B6" opacity=".28" filter="url(#soft)"/>
    <circle cx="188" cy="196" r="11" fill="#8FF7EC"/>
  </svg>
</div>
</body>
</html>
