<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1024px; height: 500px; overflow: hidden;
    background: linear-gradient(180deg, #0e0b2c 0%, #1f0b44 55%, #2b0c48 100%);
    font-family: -apple-system, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .stage { position: relative; width: 1024px; height: 500px; }

  /* Soft ambient glow behind everything */
  .glow-a { position:absolute; width:700px; height:700px; left:-120px; top:-160px;
    background: radial-gradient(circle, rgba(163,140,255,0.30) 0%, rgba(163,140,255,0) 65%); }
  .glow-b { position:absolute; width:600px; height:600px; right:-150px; bottom:-200px;
    background: radial-gradient(circle, rgba(255,211,90,0.14) 0%, rgba(255,211,90,0) 65%); }

  /* Star field */
  .star { position:absolute; border-radius:50%; background:#fff; }

  /* Orbit rings on the right side, echoing gameplay */
  .ring {
    position:absolute; border-radius:50%;
    border: 3px solid rgba(163,140,255,0.85);
    box-shadow: 0 0 22px 2px rgba(163,140,255,0.45);
  }
  .ring.gate {
    border-color: rgba(74,242,201,0.95);
    box-shadow: 0 0 26px 4px rgba(74,242,201,0.55);
  }
  .ring.dashed {
    border-style: dashed;
    border-width: 2px;
  }
  .hazard {
    position:absolute; border-radius:50%;
    border: 7px solid transparent;
    border-top-color: rgba(255,77,106,0.95);
    border-right-color: rgba(255,77,106,0.95);
    filter: drop-shadow(0 0 8px rgba(255,77,106,0.6));
  }

  .orb {
    position:absolute; width:26px; height:26px; border-radius:50%;
    background: #ffffff;
    box-shadow: 0 0 6px 2px #fff, 0 0 40px 14px rgba(163,140,255,0.85);
  }
  .trail {
    position:absolute; border-radius:50%;
    background: rgba(163,140,255,0.5);
  }
  .lumen {
    position:absolute; width:11px; height:11px; border-radius:50%;
    background: #ffd35a;
    box-shadow: 0 0 10px 3px rgba(255,211,90,0.85);
  }

  .wordmark-wrap { position:absolute; left:64px; top:0; height:500px; display:flex; flex-direction:column; justify-content:center; }
  .wordmark {
    font-size: 92px; font-weight: 900; letter-spacing: 6px; color:#ffffff;
    text-shadow: 0 0 40px rgba(163,140,255,0.85), 0 0 90px rgba(163,140,255,0.4);
    line-height: 1;
  }
  .tagline {
    margin-top: 18px; font-size: 24px; font-weight: 500; letter-spacing: 3px;
    color: rgba(255,255,255,0.62); text-transform: lowercase;
  }
  .pips { margin-top: 30px; display:flex; gap: 14px; }
  .pip {
    padding: 9px 20px; border-radius: 999px; font-size: 16px; font-weight: 700;
    color: #120a2e; background: #ffd35a;
  }
  .pip.alt { background: transparent; color: #fff; border: 1.5px solid rgba(255,255,255,0.4); }
</style>
</head>
<body>
<div class="stage">
  <div class="glow-a"></div>
  <div class="glow-b"></div>

  <!-- stars -->
  <div class="star" style="width:2px;height:2px;left:120px;top:60px;opacity:.5"></div>
  <div class="star" style="width:3px;height:3px;left:220px;top:140px;opacity:.7"></div>
  <div class="star" style="width:2px;height:2px;left:60px;top:300px;opacity:.4"></div>
  <div class="star" style="width:2px;height:2px;left:340px;top:50px;opacity:.6"></div>
  <div class="star" style="width:3px;height:3px;left:430px;top:420px;opacity:.5"></div>
  <div class="star" style="width:2px;height:2px;left:150px;top:430px;opacity:.5"></div>
  <div class="star" style="width:2px;height:2px;left:900px;top:60px;opacity:.6"></div>
  <div class="star" style="width:2px;height:2px;left:980px;top:220px;opacity:.5"></div>
  <div class="star" style="width:3px;height:3px;left:850px;top:400px;opacity:.6"></div>

  <!-- Wordmark left side -->
  <div class="wordmark-wrap">
    <div class="wordmark">ORBEON</div>
    <div class="tagline">the journey of light</div>
    <div class="pips">
      <div class="pip">120 LEVELS</div>
      <div class="pip alt">FREE TO PLAY</div>
    </div>
  </div>

  <!-- Orbit chain on the right -->
  <div class="ring" style="width:150px;height:150px;right:70px;top:50px;"></div>
  <div class="hazard" style="width:150px;height:150px;right:70px;top:50px; transform:rotate(35deg);"></div>

  <div class="ring" style="width:130px;height:130px;right:230px;top:220px;"></div>

  <div class="ring gate" style="width:150px;height:150px;right:70px;top:320px;"></div>
  <div class="ring gate dashed" style="width:172px;height:172px;right:59px;top:309px;"></div>

  <!-- trail + orb flying between rings -->
  <div class="trail" style="width:6px;height:6px;right:190px;top:150px;opacity:.25"></div>
  <div class="trail" style="width:9px;height:9px;right:210px;top:175px;opacity:.4"></div>
  <div class="trail" style="width:13px;height:13px;right:235px;top:200px;opacity:.6"></div>
  <div class="orb" style="right:255px;top:222px;"></div>

  <!-- lumens near the rings -->
  <div class="lumen" style="right:150px;top:190px;"></div>
  <div class="lumen" style="right:290px;top:280px;"></div>
  <div class="lumen" style="right:110px;top:360px;"></div>
</div>
</body>
</html>
